name: Container Build & Security

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  hadolint:
    name: ${{ matrix.service.name }} / Hadolint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: auth-service
            path: backend/auth
          - name: booking-service
            path: backend/booking-service
          - name: chat-service
            path: backend/chat-service
          - name: admin-service
            path: backend/admin-service
          - name: search-service
            path: backend/search-service
          - name: frontend
            path: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Hadolint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: "${{ matrix.service.path }}/Dockerfile"
          failure-threshold: warning

  compose-validate:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create dummy .env for validation
        run: |
          cat <<'EOF' > .env
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          JWT_SECRET=dummy
          REFRESH_SECRET=dummy
          MINIO_ROOT_USER=minioadmin
          MINIO_ROOT_PASSWORD=minioadmin
          MEILI_MASTER_KEY=dummy
          RABBITMQ_DEFAULT_USER=admin
          RABBITMQ_DEFAULT_PASS=admin
          EOF

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

  build-scan-push:
    name: ${{ matrix.service.name }} / build, scan, push
    runs-on: ubuntu-latest
    needs: [hadolint, compose-validate]
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: auth-service
            path: backend/auth
            image: mdkli-auth-service
          - name: booking-service
            path: backend/booking-service
            image: mdkli-booking-service
          - name: chat-service
            path: backend/chat-service
            image: mdkli-chat-service
          - name: admin-service
            path: backend/admin-service
            image: mdkli-admin-service
          - name: search-service
            path: backend/search-service
            image: mdkli-search-service
          - name: frontend
            path: frontend
            image: mdkli-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set lowercase repository owner
        run: echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/${{ matrix.service.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image (load locally for scanning)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.service.path }}
          push: false
          load: true
          tags: local/${{ matrix.service.image }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache/${{ matrix.service.name }}
          cache-to: type=local,dest=/tmp/.buildx-cache/${{ matrix.service.name }},mode=max

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@d94f46e13c6c62f59525ac9a1e147a99dc0b9bf5 # v0.17.0
        with:
          image: local/${{ matrix.service.image }}:${{ github.sha }}
          format: spdx-json
          output-file: ${{ matrix.service.name }}-sbom.spdx.json
        continue-on-error: true

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ matrix.service.name }}
          path: ${{ matrix.service.name }}-sbom.spdx.json
          retention-days: 30

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/${{ matrix.service.image }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.service.name }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          cache-dir: /tmp/.trivy-cache

      - name: Upload Trivy report artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: trivy-${{ matrix.service.name }}
          path: trivy-${{ matrix.service.name }}.sarif
          retention-days: 30

      - name: Fail build on critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/${{ matrix.service.image }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Push image to GHCR
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.service.path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache/${{ matrix.service.name }}
          cache-to: type=local,dest=/tmp/.buildx-cache/${{ matrix.service.name }},mode=max

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign image (keyless)
        if: github.event_name != 'pull_request'
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          cosign sign --yes \
            "${REGISTRY}/${REPO_OWNER}/${{ matrix.service.image }}@${{ steps.push.outputs.digest }}"

      - name: Verify signature (keyless)
        if: github.event_name != 'pull_request'
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${REGISTRY}/${REPO_OWNER}/${{ matrix.service.image }}@${{ steps.push.outputs.digest }}"
