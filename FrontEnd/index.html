<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="واجهة محادثة حديثة ومتعددة الجلسات لـ Chat Text API" />
  <title>Multi Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand-row">
        <div class="brand-mark" aria-hidden="true">M</div>
        <div>
          <h1>Multi Chat</h1>
          <p>واجهة بسيطة للـ API</p>
        </div>
        <button class="icon-button sidebar-close" id="closeSidebarBtn" aria-label="إغلاق القائمة">×</button>
      </div>

      <button class="primary-button new-chat-button" id="newChatBtn">
        <span aria-hidden="true">＋</span>
        محادثة جديدة
      </button>

      <label class="search-box" aria-label="البحث في المحادثات">
        <span aria-hidden="true">⌕</span>
        <input id="chatSearch" type="search" placeholder="ابحث في المحادثات..." autocomplete="off" />
      </label>

      <div class="chat-list" id="chatList" aria-live="polite"></div>

      <section class="api-settings">
        <div class="section-title-row">
          <h2>إعدادات الاتصال</h2>
          <span class="status-dot" id="statusDot" title="حالة آخر طلب"></span>
        </div>

        <label>
          Base URL
          <input id="baseUrlInput" type="url" value="http://localhost:8001" dir="ltr" />
        </label>

        <label>
          Endpoint
          <input id="endpointInput" type="text" value="/v1/chat/text" dir="ltr" />
        </label>

        <button class="secondary-button" id="saveSettingsBtn">حفظ الإعدادات</button>
      </section>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="main-panel">
      <header class="topbar">
        <button class="icon-button menu-button" id="openSidebarBtn" aria-label="فتح القائمة">☰</button>
        <div class="chat-heading">
          <h2 id="chatTitle">محادثة جديدة</h2>
          <p id="threadLabel">Thread ID: —</p>
        </div>
        <button class="ghost-button" id="clearChatBtn">مسح الرسائل</button>
      </header>

      <section class="messages" id="messages" aria-live="polite" aria-label="الرسائل"></section>

      <div class="empty-state" id="emptyState">
        <div class="empty-icon" aria-hidden="true">✦</div>
        <h2>ابدأ محادثة جديدة</h2>
        <p>اكتب رسالتك وسيتم إرسالها إلى <code>/v1/chat/text</code> مع رقم الجلسة الحالية.</p>
        <div class="prompt-chips">
          <button data-prompt="مرحباً، عرفني بنفسك">تعريف سريع</button>
          <button data-prompt="ساعدني في تلخيص هذا النص">تلخيص نص</button>
          <button data-prompt="أعطني أفكاراً لمشروع جديد">أفكار مشروع</button>
        </div>
      </div>

      <footer class="composer-wrap">
        <form class="composer" id="chatForm">
          <textarea
            id="messageInput"
            rows="1"
            placeholder="اكتب رسالتك هنا..."
            aria-label="نص الرسالة"
            required
          ></textarea>
          <button class="send-button" id="sendBtn" type="submit" aria-label="إرسال الرسالة">
            <span>إرسال</span>
            <span aria-hidden="true">➤</span>
          </button>
        </form>
        <p class="composer-hint">Enter للإرسال — Shift + Enter لسطر جديد</p>
      </footer>
    </main>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
