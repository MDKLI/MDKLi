x-mdkli-common: &mdkli-common
  image: mdkli:latest
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  environment:
    QDRANT_HOST: qdrant
    QDRANT_PORT: "6333"
    QDRANT_URL: http://qdrant:6333
  restart: unless-stopped
  volumes:
    - ./short_term_memory:/app/data
  depends_on:
    - qdrant

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - ./long_term_memory:/qdrant/storage
    restart: unless-stopped

  chainlit:
    build:
      context: .
      dockerfile: Dockerfile.chainlit
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      QDRANT_URL: http://qdrant:6333
    restart: unless-stopped
    volumes:
      - ./short_term_memory:/app/data
    depends_on:
      - qdrant

  whatsapp:
    <<: *mdkli-common
    ports:
      - "8080:8080"

  api:
    <<: *mdkli-common
    command:
      - /app/.venv/bin/fastapi
      - run
      - ai_companion/interfaces/api/main.py
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8001:8000"