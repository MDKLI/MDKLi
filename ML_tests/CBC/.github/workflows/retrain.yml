name: Retrain


on:
  schedule:
    - cron: "0 3 * * 1"  
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt
          pip install dvc dvc-gdrive

      - name: Configure DVC credentials
        run: |
          echo '${{ secrets.DVC_GDRIVE_CREDENTIALS }}' > "$RUNNER_TEMP/gdrive-credentials.json"
          dvc remote modify gdrive_remote --local gdrive_service_account_json_file_path "$RUNNER_TEMP/gdrive-credentials.json"


      - name: Pull versioned dataset
        run: dvc pull

      - name: Run training pipeline
        run: make train

      - name: Regenerate field medians
        run: make medians

      - name: Run tests against the freshly-trained model
        run: make test-integration


      - name: Commit updated artifacts
        run: |
          git config user.name "cbc-retrain-bot"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/
          git diff --cached --quiet && echo "No artifact changes to commit." && exit 0
          git commit -m "chore: automated retrain $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
